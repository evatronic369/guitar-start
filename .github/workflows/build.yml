name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q replica-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p replica/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: guitar-start-apk
          path: replica/android/app/build/outputs/apk/debug/app-debug.apk
